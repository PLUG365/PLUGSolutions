name: Deploy production

run-name: Deploy production — ${{ inputs.reason }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Release note or reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://kind-stone-076361900.7.azurestaticapps.net
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate, test, and build
        run: npm run check
      - name: Deploy prebuilt static output
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out
          output_location: ""
          skip_app_build: true

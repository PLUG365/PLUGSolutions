name: Sync catalog lifecycle

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: Optional approved slug to process
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: import-approved-submission
  cancel-in-progress: false

jobs:
  prepare-pull-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Read SharePoint lifecycle state and prepare files
        env:
          PLUG_SHAREPOINT_SITE_ID: ${{ vars.PLUG_SHAREPOINT_SITE_ID }}
          PLUG_SUBMISSIONS_LIST_ID: ${{ vars.PLUG_SUBMISSIONS_LIST_ID }}
          REQUESTED_SLUG: ${{ inputs.slug }}
        run: |
          graph_token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          echo "::add-mask::$graph_token"
          GRAPH_TOKEN="$graph_token" npm run prepare:approved
      - name: Read safe processing result
        id: result
        run: |
          status="$(node -p "JSON.parse(require('fs').readFileSync('.automation/approved-result.json','utf8')).status")"
          operation="$(node -p "JSON.parse(require('fs').readFileSync('.automation/approved-result.json','utf8')).operation || ''")"
          slug="$(node -p "JSON.parse(require('fs').readFileSync('.automation/approved-result.json','utf8')).slug || ''")"
          thumbnail_status="$(node -p "JSON.parse(require('fs').readFileSync('.automation/approved-result.json','utf8')).thumbnailStatus || ''")"
          source_item_id="$(node -p "JSON.parse(require('fs').readFileSync('.automation/approved-result.json','utf8')).sourceRevision?.itemId || ''")"
          source_revision="$(node -p "JSON.parse(require('fs').readFileSync('.automation/approved-result.json','utf8')).sourceRevision?.lastModifiedDateTime || ''")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "thumbnail_status=$thumbnail_status" >> "$GITHUB_OUTPUT"
          echo "source_item_id=$source_item_id" >> "$GITHUB_OUTPUT"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
      - name: Stop when no item is ready
        if: steps.result.outputs.status == 'none'
        run: echo "No catalog lifecycle change is ready."
      - name: Check for an existing automation branch
        if: steps.result.outputs.status == 'prepared'
        id: branch
        env:
          OPERATION: ${{ steps.result.outputs.operation }}
          SLUG: ${{ steps.result.outputs.slug }}
        run: |
          if test "$OPERATION" = "remove"; then
            branch="automation/remove-$SLUG"
          else
            branch="automation/catalog-$SLUG"
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing automation branch found; leaving it unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "name=$branch" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate prepared catalog change
        if: steps.result.outputs.status == 'prepared' && steps.branch.outputs.exists == 'false'
        run: npm run check
      - name: Revalidate SharePoint revision
        if: steps.result.outputs.status == 'prepared' && steps.branch.outputs.exists == 'false'
        env:
          PLUG_SHAREPOINT_SITE_ID: ${{ vars.PLUG_SHAREPOINT_SITE_ID }}
          PLUG_SUBMISSIONS_LIST_ID: ${{ vars.PLUG_SUBMISSIONS_LIST_ID }}
        run: |
          graph_token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          echo "::add-mask::$graph_token"
          GRAPH_TOKEN="$graph_token" npm run verify:approved
      - name: Commit and push automation branch
        if: steps.result.outputs.status == 'prepared' && steps.branch.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          OPERATION: ${{ steps.result.outputs.operation }}
          SLUG: ${{ steps.result.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A -- "catalog/solutions/$SLUG.json"
          if git ls-files --error-unmatch -- "public/images/solutions/$SLUG.webp" >/dev/null 2>&1 || test -e "public/images/solutions/$SLUG.webp"; then
            git add -A -- "public/images/solutions/$SLUG.webp"
          fi
          if test "$OPERATION" = "remove"; then
            git commit -m "catalog: remove $SLUG"
          else
            git commit -m "catalog: $OPERATION $SLUG"
          fi
          git push --set-upstream origin "$BRANCH"
      - name: Create pull request
        if: steps.result.outputs.status == 'prepared' && steps.branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OPERATION: ${{ steps.result.outputs.operation }}
          SLUG: ${{ steps.result.outputs.slug }}
          THUMBNAIL_STATUS: ${{ steps.result.outputs.thumbnail_status }}
          SOURCE_ITEM_ID: ${{ steps.result.outputs.source_item_id }}
          SOURCE_REVISION: ${{ steps.result.outputs.source_revision }}
        run: |
          if test "$OPERATION" = "remove"; then
            title="catalog: remove $SLUG"
            summary="Power Appsで取り下げ済みの作品を公開カタログから外す変更を自動準備しました。"
          else
            title="catalog: $OPERATION $SLUG"
            summary="Power Appsで承認済みの申請を自動準備しました。"
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "$summary

          - operation: \`$OPERATION\`
          - slug: \`$SLUG\`
          - thumbnail: \`$THUMBNAIL_STATUS\`
          - SharePoint item: \`$SOURCE_ITEM_ID\`
          - accepted revision: \`$SOURCE_REVISION\`

          対象ファイル、画像、CI結果を確認してから承認してください。候補画像URLや審査用の非公開情報はこのPRに含めていません。"

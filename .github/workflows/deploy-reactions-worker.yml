name: Deploy reactions Worker

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Release note or reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reactions-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: reactions-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Skip when production credentials are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare production credentials are not configured; no Worker deployment was attempted."
      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate catalog manifest
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run generate:reaction-manifest
      - name: Test Worker and local D1 adapter
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run typecheck:worker && npm run test:worker
      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 migrations apply plug-solutions-reactions --remote
          node scripts/manifest-sql.mjs > "$RUNNER_TEMP/reaction-manifest.sql"
          npx --yes wrangler@4 d1 execute plug-solutions-reactions --remote --file "$RUNNER_TEMP/reaction-manifest.sql"
          npx --yes wrangler@4 deploy

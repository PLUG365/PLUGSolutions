                      Control: Label
                      Properties:
                        Color: =RGBA(61, 95, 89, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="画像候補（非公開・確認用）"
                        Visible: =!IsBlank(varSelectedRequest)
                  - lnkThumbnailCandidate:
                      Control: Label

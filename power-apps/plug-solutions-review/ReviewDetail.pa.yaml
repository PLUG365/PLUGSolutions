Screens:
  ReviewDetail:
    Properties:
      Fill: =RGBA(244, 240, 230, 1)
      LoadingSpinnerColor: =RGBA(255, 96, 66, 1)
    Children:
      - conDetailRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244, 240, 230, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =If(App.Width < 768, 12, 24)
            PaddingLeft: =If(App.Width < 768, 12, 24)
            PaddingRight: =If(App.Width < 768, 12, 24)
            PaddingTop: =If(App.Width < 768, 12, 24)
            Width: =Parent.Width
          Children:
            - conDetailHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                Children:
                  - btnDetailBack:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =RGBA(20, 21, 18, 1)
                        Color: =RGBA(20, 21, 18, 1)
                        Fill: =RGBA(244, 240, 230, 1)
                        Height: =48
                        HoverFill: =RGBA(193, 255, 68, 1)
                        LayoutMinHeight: =48
                        LayoutMinWidth: =96
                        OnSelect: =Back()
                        PressedFill: =RGBA(193, 255, 68, 1)
                        RadiusBottomLeft: =24
                        RadiusBottomRight: =24
                        RadiusTopLeft: =24
                        RadiusTopRight: =24
                        Text: ="← 戻る"
                        Width: =104
                  - lblDetailHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(20, 21, 18, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =48
                        LayoutMinWidth: =120
                        Size: =If(App.Width < 768, 20, 24)
                        Text: ="掲載申請の審査"
            - conDetailScroll:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =120
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =If(App.Width < 768, 12, 24)
                  PaddingRight: =If(App.Width < 768, 12, 24)
                  PaddingTop: =16
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - lblNoSelection:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(61, 95, 89, 1)
                        Height: =64
                        LayoutMinHeight: =64
                        Text: ="審査する申請を一覧から選択してください。"
                        Visible: =IsBlank(varSelectedRequest)
                        Width: =Parent.Width-Self.X-20
                  - lblCurrentStatus:
                      Control: Label
                      Properties:
                        Color: =RGBA(61, 95, 89, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        LayoutMinHeight: =44
                        Text: |-
                          ="現在の状態: " & Coalesce(varSelectedRequest.ReviewStatus.Value, "未設定")
                        Visible: =!IsBlank(varSelectedRequest)
                        Width: =Parent.Width-Self.X-20
                  - conThumbnail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(193, 255, 68, 1)
                        FillPortions: =0
                        Height: =220
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =220
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =!IsBlank(varSelectedRequest)
                      Children:
                        - imgProcessedThumbnail:
                            Control: Image
                            Properties:
                              Height: =196
                              Image: =varSelectedRequest.ThumbnailPath
                              LayoutMinHeight: =196
                              LayoutMinWidth: =160
                              Visible: =!IsBlank(varSelectedRequest.ThumbnailPath)
                              Width: =Parent.Width
                        - lblThumbnailFallback:
                            Control: Label
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(20, 21, 18, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =196
                              LayoutMinHeight: =196
                              Size: =72
                              Text: =Upper(Left(Coalesce(varSelectedRequest.Title, "?"), 1))
                              Visible: =IsBlank(varSelectedRequest.ThumbnailPath)
                              Width: =Parent.Width
                  - lblTypesAndUsesRaw:
                      Control: Label
                      Properties:
                        Fill: =RGBA(230, 230, 230, 1)
                        Height: =80
                        Overflow: =Overflow.Scroll
                        Text: ="Q6 原文（種類・主な用途）" & Coalesce(varSelectedRequest.TypesAndUses, "未入力")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =!IsBlank(varSelectedRequest)
                        Width: =Parent.Width-Self.X-20
                  - lblRelatedUrlsRaw:
                      Control: Label
                      Properties:
                        Fill: =RGBA(230, 230, 230, 1)
                        Height: =80
                        Overflow: =Overflow.Scroll
                        Text: ="Q8 原文（関連URL）" & Coalesce(varSelectedRequest.RelatedUrls, "未入力")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =!IsBlank(varSelectedRequest)
                        Width: =Parent.Width-Self.X-20
                  - lblThumbnailCandidateRaw:
                      Control: Label
                      Properties:
                        Fill: =RGBA(230, 230, 230, 1)
                        Height: =48
                        Overflow: =Overflow.Scroll
                        Text: ="Q9 原文（画像候補）" & Coalesce(varSelectedRequest.ThumbnailCandidateUrl, "未入力")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =!IsBlank(varSelectedRequest)
                        Width: =Parent.Width-Self.X-20
                  - btnQueueCandidateImage_3:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =RGBA(61, 95, 89, 1)
                        Color: =RGBA(20, 21, 18, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =48
                        LayoutMinHeight: =48
                        OnSelect: =Launch(varSelectedRequest.ThumbnailCandidateUrl)
                        Text: ="申請画像URLを確認 ↗"
                        Visible: =!IsBlank(varSelectedRequest) && !IsBlank(varSelectedRequest.ThumbnailCandidateUrl)
                        Width: =Parent.Width-Self.X-20
                  - lblTitle:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="作品名 *"
                        Width: =Parent.Width-Self.X-20
                  - txtTitle:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.Title
                        DisplayMode: =DisplayMode.View
                        Height: =48
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        Width: =Parent.Width-Self.X-20
                  - lblMakerDisplayName:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="作者表示名 *"
                  - txtMakerDisplayName:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.MakerDisplayName
                        DisplayMode: =DisplayMode.View
                        Height: =48
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        Width: =Parent.Width-Self.X-20
                  - lblXHandle:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="Xアカウント（@から） *"
                        Width: =Parent.Width-Self.X-20
                  - txtXHandle:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.XHandle
                        DisplayMode: =DisplayMode.View
                        Height: =48
                        HintText: ="@example"
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        Width: =Parent.Width-Self.X-20
                  - btnQueueCandidateImage_5:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =RGBA(61, 95, 89, 1)
                        Color: =RGBA(20, 21, 18, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =48
                        LayoutMinHeight: =48
                        OnSelect: =Launch("https://x.com/"&Substitute(varSelectedRequest.XHandle,"@",""))
                        Text: ="Xアカウントを確認 ↗"
                        Visible: =!IsBlank(varSelectedRequest) && !IsBlank(varSelectedRequest.ThumbnailCandidateUrl)
                        Width: =Parent.Width-Self.X-20
                  - lblDescription:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="作品概要 *"
                        Width: =Parent.Width-Self.X-20
                  - txtDescription:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.Description
                        DisplayMode: =DisplayMode.View
                        Fill: =RGBA(230, 230, 230, 1)
                        Height: =120
                        LayoutMinHeight: =120
                        LayoutMinWidth: =0
                        Mode: =TextMode.MultiLine
                        Width: =Parent.Width-Self.X-20
                  - lblDistributionUrl:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="配布先URL（https://） *"
                        Width: =Parent.Width-Self.X-20
                  - txtDistributionUrl:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.DistributionUrl
                        DisplayMode: =DisplayMode.View
                        Height: =48
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        Width: =Parent.Width-Self.X-20
                  - btnQueueCandidateImage_4:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =RGBA(61, 95, 89, 1)
                        Color: =RGBA(20, 21, 18, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =48
                        LayoutMinHeight: =48
                        OnSelect: =Launch(varSelectedRequest.DistributionUrl)
                        Text: ="配布先URLを確認 ↗"
                        Visible: =!IsBlank(varSelectedRequest) && !IsBlank(varSelectedRequest.ThumbnailCandidateUrl)
                        Width: =Parent.Width-Self.X-20
                  - lblSlug:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="Slug（英小文字・数字・ハイフン） *"
                        Width: =Parent.Width-Self.X-20
                  - txtSlug:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.Slug
                        DisplayMode: =DisplayMode.View
                        Height: =48
                        HintText: ="my-solution"
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        Width: =Parent.Width-Self.X-20
                  - lblThumbnailPath:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="処理済みサムネイルパス"
                        Width: =Parent.Width-Self.X-20
                  - txtThumbnailPath:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.ThumbnailPath
                        DisplayMode: =DisplayMode.View
                        Height: =48
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        Width: =Parent.Width-Self.X-20
                  - lblReviewNotes:
                      Control: Label
                      Properties:
                        Color: =RGBA(61, 95, 89, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =32
                        Text: ="審査メモ（非公開・却下時必須）"
                        Width: =Parent.Width-Self.X-20
                  - txtReviewNotes:
                      Control: Classic/TextInput
                      Properties:
                        Default: =varSelectedRequest.ReviewNotes
                        Height: =112
                        LayoutMinHeight: =112
                        LayoutMinWidth: =0
                        Mode: =TextMode.MultiLine
                        Width: =Parent.Width-Self.X-20
                  - lblDetailNotice:
                      Control: Label
                      Properties:
                        Color: =If(StartsWith(varNotice, "完了"), RGBA(61, 95, 89, 1), RGBA(170, 45, 30, 1))
                        FontWeight: =FontWeight.Semibold
                        Height: =If(IsBlank(varNotice), 0, 56)
                        LayoutMinHeight: =If(IsBlank(varNotice), 0, 56)
                        Text: =varNotice
                        Visible: =!IsBlank(varNotice)
                        Width: =Parent.Width
                  - conDetailActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.Width < 520, 164, 56)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =If(App.Width < 520, 164, 56)
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingBottom: =2
                        PaddingLeft: =2
                        PaddingRight: =2
                        PaddingTop: =2
                        Visible: =!IsBlank(varSelectedRequest)
                      Children:
                        - btnSaveDraft:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(20, 21, 18, 1)
                              Color: =RGBA(20, 21, 18, 1)
                              DisplayMode: =DisplayMode.Disabled
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =48
                              LayoutMinHeight: =48
                              LayoutMinWidth: =128
                              OnSelect: |-
                                =Set(varSaving, true);
                                Refresh(掲載申請);
                                Set(varCurrentRequest, LookUp(掲載申請, ID = varSelectedRequest.ID));
                                If(
                                  IsBlank(varCurrentRequest),
                                  Set(varNotice, "保存できません。申請が見つかりません。"),
                                  varCurrentRequest.Modified <> varSelectedRequest.Modified || Coalesce(varCurrentRequest.ReviewStatus.Value, "") <> Coalesce(varSelectedRequest.ReviewStatus.Value, ""),
                                  Set(varNotice, "他の更新を検出しました。一覧へ戻って再読込してください。"),
                                  IfError(
                                    Patch(掲載申請, varCurrentRequest, {ReviewNotes: Trim(txtReviewNotes.Text)});
                                    Refresh(掲載申請);
                                    Set(varSelectedRequest, LookUp(掲載申請, ID = varSelectedRequest.ID));
                                    Set(varNotice, "完了: 下書きを保存しました。"),
                                    Set(varNotice, "保存に失敗しました。接続を確認してください。")
                                  )
                                );
                                Set(varSaving, false)
                              Text: ="保存"
                        - btnReject:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(170, 45, 30, 1)
                              Color: =RGBA(170, 45, 30, 1)
                              DisplayMode: =If(varSaving || IsBlank(varSelectedRequest) || Coalesce(varSelectedRequest.ReviewStatus.Value, "") = "承認", DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =48
                              LayoutMinHeight: =48
                              LayoutMinWidth: =128
                              OnSelect: |-
                                =Set(varSaving, true);
                                Refresh(掲載申請);
                                Set(varCurrentRequest, LookUp(掲載申請, ID = varSelectedRequest.ID));
                                If(
                                  IsBlank(Trim(txtReviewNotes.Text)),
                                  Set(varNotice, "却下理由を審査メモへ入力してください。"),
                                  IsBlank(varCurrentRequest),
                                  Set(varNotice, "却下できません。申請が見つかりません。"),
                                  varCurrentRequest.Modified <> varSelectedRequest.Modified || Coalesce(varCurrentRequest.ReviewStatus.Value, "") <> Coalesce(varSelectedRequest.ReviewStatus.Value, ""),
                                  Set(varNotice, "他の更新を検出しました。一覧へ戻って再読込してください。"),
                                  IfError(
                                    Patch(掲載申請, varCurrentRequest, {ReviewNotes: Trim(txtReviewNotes.Text), ReviewStatus: {Value: "却下"}, ReviewedAt: Now()});
                                    Refresh(掲載申請);
                                    Set(varSelectedRequest, LookUp(掲載申請, ID = varSelectedRequest.ID));
                                    Set(varNotice, "完了: 申請を却下しました。"),
                                    Set(varNotice, "却下処理に失敗しました。接続を確認してください。")
                                  )
                                );
                                Set(varSaving, false)
                              Text: ="却下"
                        - btnApprove:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(255, 96, 66, 1)
                              Color: =RGBA(20, 21, 18, 1)
                              DisplayMode: =If(varSaving || IsBlank(varSelectedRequest) || Coalesce(varSelectedRequest.ReviewStatus.Value, "") = "承認", DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 96, 66, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =48
                              HoverFill: =RGBA(193, 255, 68, 1)
                              LayoutMinHeight: =48
                              LayoutMinWidth: =128
                              OnSelect: |-
                                =Set(varSaving, true);
                                Refresh(掲載申請);
                                Set(varCurrentRequest, LookUp(掲載申請, ID = varSelectedRequest.ID));
                                If(
                                  IsBlank(Trim(txtTitle.Text)) || IsBlank(Trim(txtMakerDisplayName.Text)) || !StartsWith(Trim(txtXHandle.Text), "@") || IsBlank(Trim(txtDescription.Text)) || !StartsWith(Lower(Trim(txtDistributionUrl.Text)), "https://") || !IsMatch(Trim(txtSlug.Text), "^[a-z0-9]+(-[a-z0-9]+)*$") || IsBlank(Trim(Coalesce(varSelectedRequest.TypesAndUses, ""))),
                                  Set(varNotice, "承認できません。申請内容と入力形式を確認してください。"),
                                  IsBlank(varCurrentRequest),
                                  Set(varNotice, "承認できません。申請が見つかりません。"),
                                  varCurrentRequest.Modified <> varSelectedRequest.Modified || Coalesce(varCurrentRequest.ReviewStatus.Value, "") <> Coalesce(varSelectedRequest.ReviewStatus.Value, ""),
                                  Set(varNotice, "他の更新を検出しました。一覧へ戻って再読込してください。"),
                                  IfError(
                                    Patch(掲載申請, varCurrentRequest, {ReviewNotes: Trim(txtReviewNotes.Text), ReviewStatus: {Value: "承認"}, ReviewedAt: Now()});
                                    Refresh(掲載申請);
                                    Set(varSelectedRequest, LookUp(掲載申請, ID = varSelectedRequest.ID));
                                    Set(varNotice, "完了: 申請を承認しました。"),
                                    Set(varNotice, "承認処理に失敗しました。接続を確認してください。")
                                  )
                                );
                                Set(varSaving, false)
                              PressedFill: =RGBA(193, 255, 68, 1)
                              Text: ="承認"
                  - lblDetailPublishHint:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(61, 95, 89, 1)
                        LayoutMinHeight: =48
                        Text: ="GitHub の掲載PRがマージされ、本番サイトで掲載を確認してから「公開済みにする」を実行してください。"
                        Visible: =!IsBlank(varSelectedRequest)
                        Width: =Parent.Width
                  - lblDetailWithdrawHint:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(61, 95, 89, 1)
                        LayoutMinHeight: =48
                        Text: ="取り下げは公開カタログから外すための状態です。申請内容と審査履歴は削除しません。GitHub 側の反映は別途確認してください。"
                        Visible: =!IsBlank(varSelectedRequest) && Coalesce(varSelectedRequest.ReviewStatus.Value, "") = "公開済み"
                        Width: =Parent.Width
                  - conDetailLifecycleActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.Width < 380, 112, 56)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =If(App.Width < 380, 112, 56)
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingBottom: =2
                        PaddingLeft: =2
                        PaddingRight: =2
                        PaddingTop: =2
                        Visible: =!IsBlank(varSelectedRequest) && (Coalesce(varSelectedRequest.ReviewStatus.Value, "") = "承認" || Coalesce(varSelectedRequest.ReviewStatus.Value, "") = "公開済み")
                      Children:
                        - btnDetailMarkPublished:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(20, 21, 18, 1)
                              Color: =RGBA(20, 21, 18, 1)
                              DisplayMode: =If(varSaving || IsBlank(varSelectedRequest) || Coalesce(varSelectedRequest.ReviewStatus.Value, "") <> "承認", DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(193, 255, 68, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =48
                              HoverFill: =RGBA(255, 96, 66, 1)
                              LayoutMinHeight: =48
                              LayoutMinWidth: =156
                              OnSelect: |-
                                =Set(varSaving, true); Set(varNotice, ""); Refresh(掲載申請); Set(varCurrentRequest, LookUp(掲載申請, ID = varSelectedRequest.ID)); If(IsBlank(varCurrentRequest), Set(varNotice, "公開済みにできません。対象が見つかりません。"), varCurrentRequest.Modified <> varSelectedRequest.Modified || Coalesce(varCurrentRequest.ReviewStatus.Value, "") <> Coalesce(varSelectedRequest.ReviewStatus.Value, ""), Set(varNotice, "他の担当者が更新しました。公開済みにせず最新内容を表示しました。"); Set(varSelectedRequest, varCurrentRequest), Coalesce(varCurrentRequest.ReviewStatus.Value, "") <> "承認", Set(varNotice, "公開済みにできません。最新状態が承認ではありません。"); Set(varSelectedRequest, varCurrentRequest), IfError(Set(varSavedRequest, Patch(掲載申請, varCurrentRequest, {ReviewStatus: {Value: "公開済み"}, ReviewedAt: Now()})); Refresh(掲載申請); Set(varSelectedRequest, LookUp(掲載申請, ID = varSavedRequest.ID)); Set(varNotice, "完了: 公開済みにしました。"), Set(varNotice, "公開済みへの変更に失敗しました。接続を確認してください。"))); Set(varSaving, false)
                              PressedFill: =RGBA(255, 96, 66, 1)
                              Text: ="公開済みにする"
                              Visible: =!IsBlank(varSelectedRequest) && Coalesce(varSelectedRequest.ReviewStatus.Value, "") = "承認"
                        - btnDetailWithdraw:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(170, 45, 30, 1)
                              Color: =RGBA(170, 45, 30, 1)
                              DisplayMode: =If(varSaving || IsBlank(varSelectedRequest) || Coalesce(varSelectedRequest.ReviewStatus.Value, "") <> "公開済み" || IsBlank(Trim(txtReviewNotes.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =48
                              LayoutMinHeight: =48
                              LayoutMinWidth: =156
                              OnSelect: |-
                                =If(IsBlank(Trim(txtReviewNotes.Text)), Set(varNotice, "取り下げ理由を審査メモへ入力してください。"), Set(varSaving, true); Set(varNotice, ""); Refresh(掲載申請); Set(varCurrentRequest, LookUp(掲載申請, ID = varSelectedRequest.ID)); If(IsBlank(varCurrentRequest), Set(varNotice, "取り下げできません。対象が見つかりません。"), varCurrentRequest.Modified <> varSelectedRequest.Modified || Coalesce(varCurrentRequest.ReviewStatus.Value, "") <> Coalesce(varSelectedRequest.ReviewStatus.Value, ""), Set(varNotice, "他の担当者が更新しました。取り下げず最新内容を表示しました。"); Set(varSelectedRequest, varCurrentRequest), Coalesce(varCurrentRequest.ReviewStatus.Value, "") <> "公開済み", Set(varNotice, "取り下げできません。最新状態が公開済みではありません。"); Set(varSelectedRequest, varCurrentRequest), IfError(Set(varSavedRequest, Patch(掲載申請, varCurrentRequest, {ReviewNotes: Trim(txtReviewNotes.Text), ReviewStatus: {Value: "取り下げ"}, ReviewedAt: Now()})); Refresh(掲載申請); Set(varSelectedRequest, LookUp(掲載申請, ID = varSavedRequest.ID)); Set(varNotice, "完了: 取り下げとして保存しました。"), Set(varNotice, "取り下げ処理に失敗しました。接続を確認してください。"))); Set(varSaving, false))
                              Text: ="取り下げ"
                              Visible: =!IsBlank(varSelectedRequest) && Coalesce(varSelectedRequest.ReviewStatus.Value, "") = "公開済み"
                        - btnDetailReturnToReview:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(61, 95, 89, 1)
                              Color: =RGBA(61, 95, 89, 1)
                              DisplayMode: =If(varSaving || IsBlank(varSelectedRequest) || Coalesce(varSelectedRequest.ReviewStatus.Value, "") <> "承認", DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =48

Screens:
  ReviewDetail:
    Properties:
      Fill: =RGBA(244, 240, 230, 1)
      LoadingSpinnerColor: =RGBA(255, 96, 66, 1)
    Children:
      - conDetailRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244, 240, 230, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =If(App.Width < 768, 12, 24)
            PaddingLeft: =If(App.Width < 768, 12, 24)
            PaddingRight: =If(App.Width < 768, 12, 24)
            PaddingTop: =If(App.Width < 768, 12, 24)
            Width: =Parent.Width
          Children:
            - conDetailHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                Children:
                  - btnDetailBack:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =RGBA(20, 21, 18, 1)
                        Color: =RGBA(20, 21, 18, 1)
                        Fill: =RGBA(244, 240, 230, 1)
                        Height: =48
                        HoverFill: =RGBA(193, 255, 68, 1)
                        LayoutMinHeight: =48
                        LayoutMinWidth: =96
                        OnSelect: =Back()
                        PressedFill: =RGBA(193, 255, 68, 1)
                        RadiusBottomLeft: =24
                        RadiusBottomRight: =24
                        RadiusTopLeft: =24
                        RadiusTopRight: =24
                        Text: ="← 戻る"
                        Width: =104
                  - lblDetailHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(20, 21, 18, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =48
                        LayoutMinWidth: =120
                        Size: =If(App.Width < 768, 20, 24)
                        Text: ="掲載申請の審査"
            - conDetailScroll:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =120
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =If(App.Width < 768, 12, 24)
                  PaddingRight: =If(App.Width < 768, 12, 24)
                  PaddingTop: =16
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - lblNoSelection:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(61, 95, 89, 1)
                        Height: =64
                        LayoutMinHeight: =64
                        Text: ="審査する申請を一覧から選択してください。"
                        Visible: =IsBlank(varSelectedRequest)
                  - lblCurrentStatus:
                      Control: Label
                      Properties:
                        Color: =RGBA(61, 95, 89, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        LayoutMinHeight: =44
                        Text: |-
                          ="現在の状態: " & Coalesce(varSelectedRequest.ReviewStatus.Value, "未設定")
                        Visible: =!IsBlank(varSelectedRequest)
                  - conThumbnail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(193, 255, 68, 1)
                        FillPortions: =0
                        Height: =220
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =220
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =!IsBlank(varSelectedRequest)
                      Children:
                        - imgProcessedThumbnail:
                            Control: Image
                            Properties:
                              Height: =196
                              Image: =varSelectedRequest.ThumbnailPath
                              LayoutMinHeight: =196
                              LayoutMinWidth: =160
                              Visible: =!IsBlank(varSelectedRequest.ThumbnailPath)
                              Width: =Parent.Width
                        - lblThumbnailFallback:
                            Control: Label
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(20, 21, 18, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =196
                              LayoutMinHeight: =196
                              Size: =72
                              Text: =Upper(Left(Coalesce(varSelectedRequest.Title, "?"), 1))
